name: Backend CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Backend Test Suite & Service Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: railway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Database Seeding
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/railway_test"
        run: |
          python backend/app/database/seed.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/railway_test"
        run: |
          python -m pytest backend/app/tests/ -v
