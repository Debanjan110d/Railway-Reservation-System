name: Backend CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite & Service Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: railway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Database Seeding Test
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/railway_test"
        run: |
          python backend/app/database/seed.py

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/railway_test"
        run: |
          pytest backend/app/tests/ -v --durations=10
