version: 2
updates:
  # Backend Python dependencies - weekly check, grouped minor/patch updates
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions workflows - monthly maintenance
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions:
        patterns:
          - "*"

  # Note: Routine npm version updates for /frontend are intentionally omitted
  # to keep focus on the core backend engine. Security updates remain enabled
  # repository-wide through GitHub's automated security fixes.
