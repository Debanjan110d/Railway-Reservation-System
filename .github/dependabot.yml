version: 2
updates:
  # Backend Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "ci"
