version: 2
updates:
  # 1. Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "chore(frontend-deps)"

  # 2. Backend Python pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "chore(backend-deps)"

  # 3. GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    reviewers:
      - "Debanjan110d"
    commit-message:
      prefix: "ci(actions-deps)"
